name: ci

# The tests with each feature set, and the line coverage of them all: under 90% fails
# the run. The coverage badge is our own, no third party: drawn from lcov.info and kept
# on the `badges` branch (the coverage job's last step). The tests start their own
# servers (in-process, or the etcds binary) and the ClickHouse ones a fake HTTP
# endpoint: no service containers.
on:
  push:
    branches-ignore: ["dependabot/**"]   # their pull request runs it
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a branch's newer push cancels its older run; on main each run stands (the badge):
  # a cancelled run there shows as failing
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # default; OpenTelemetry; the built-in ClickHouse queue consumer; the broker bridge
        features: ["", "--features tracer", "--features clickhouse", "--features bridge"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # etcd-client's protos (a test dependency, and the bridge's) import
      # google/protobuf/descriptor.proto: libprotobuf-dev. Ours are generated by hand (build.rs)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - run: cargo test ${{ matrix.features }}

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the coverage badge's push, to the badges branch
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      # 90: the target, as diff-doc-rs's; 91.00% (all features) when this gate was raised,
      # the generated src/etcdpb counted
      - run: cargo llvm-cov --all-features --lcov --output-path lcov.info --fail-under-lines 90
      # [coverage] our own badge, no third party: lcov.info's line coverage, drawn by
      # .github/coverage-badge.py and kept on the `badges` branch - one commit, replaced
      # each time - which the README shows. On a push to the default branch only: a pull
      # request measures and gates, no more
      - name: coverage badge
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pct=$(python3 .github/coverage-badge.py lcov.info /tmp/badges/coverage.svg)
          cd /tmp/badges
          git init -q -b badges
          git add coverage.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "coverage ${pct}%"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
