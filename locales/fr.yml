# [i18n] etcds's messages in French - not reviewed: one file per language, every key in every
# file (src/i18n.rs tests it). Keys are `module.name`, as tr!("module.name") asks for
# them; an error's message starts with its code, ETCD-Ennn, the same in every language
_version: 1

# src/cli.rs - the command line's errors (ETCD-E001..E009)
cli.config_file: "ETCD-E001 Erreur dans le fichier de configuration [%{file}] :\n%{err}"

# src/cli.rs - the command line's help: help.<arg id>, the id the EtcdConfig field's
# name, and the command's own texts. Option names, values and URLs stay as they are
help.about: "etcds - un serveur de l'API etcd v3, léger, pour la gestion de files d'attente\n(traduction non relue : LANG=en pour l'anglais ; corrections : https://github.com/vkrinitsyn/etcd/issues)"
help.after_help: "Les réglages sont ces options et le fichier --config (YAML, les clés sont les noms des champs : --listen-client-urls est listen_client_urls) ; une option donnée l'emporte sur le fichier. La plupart des réglages d'etcd ne sont acceptés que par compatibilité : https://etcd.io/docs/v3.5/op-guide/configuration/"
help.usage: "Utilisation :"
help.options: "Options "
help.arguments: "Arguments "
help.default: "[par défaut : %{value}]"
help.help: "Afficher l'aide"
help.input: "Fichiers d'entrée (non utilisés)"
help.config_path: "Le fichier de configuration, YAML ; son absence n'est pas une erreur"
help.node: "UUID du nœud"
help.cluster: "UUID du cluster"
help.term: "Mandat logique (époque) de ce nœud, incrémenté au redémarrage ou à la reconfiguration"
help.local_prefix: "Préfixes de clés jamais propagés aux pairs, séparés par des virgules : une telle clé ne vit que sur le nœud qui l'a écrite. Vide : toutes les clés se propagent"
help.local_prefix_except: "Sous-préfixes de local_prefix qui SONT propagés, séparés par des virgules ; une branche non nommée reste locale"
help.local_only_prefix: "Préfixes de clés servis uniquement à un appelant local (loopback), séparés par des virgules ; indépendants de local_prefix"
help.local_only_prefix_except: "Branches de local_only_prefix qui SONT servies aux appelants distants, séparées par des virgules ; un pair y transmet les écritures via l'API KV. Vide : aucune"
help.readonly_prefix: "Préfixes de clés qu'aucun appelant de l'API ne peut écrire, séparés par des virgules : put, delete et txn y sont refusés, seul l'hôte les écrit dans le processus. Vide : aucun"
help.zone_prefix: "Préfixes de clés propagés seulement aux pairs de la zone de ce nœud, séparés par des virgules ; se combinent avec local_prefix. Vide : aucun"
help.zone: "La zone de ce nœud. Vide : sans zone, et les nœuds sans zone partagent une même zone"
help.peer_zones: "Zone de chaque pair : host:port=zone, séparés par des virgules (le protocole des membres etcd ne transporte pas de zone)"
help.name: "Nom lisible de ce membre"
help.data_dir: "Chemin du répertoire de données. Non utilisé par etcds"
help.wal_dir: "Chemin du répertoire WAL dédié. Non utilisé par etcds"
help.snapshot_count: "Nombre de transactions validées qui déclenche un instantané sur disque. Non utilisé par etcds"
help.heartbeat_interval: "Intervalle de battement de cœur (heartbeat), en millisecondes. Non utilisé par etcds"
help.election_timeout: "Délai d'élection, en millisecondes. Non utilisé par etcds"
help.initial_election_tick_advance: "Avancer les ticks d'élection initiaux au démarrage, pour une élection plus rapide. Non utilisé par etcds"
help.listen_peer_urls: "URL d'écoute du trafic entre pairs, séparées par des virgules"
