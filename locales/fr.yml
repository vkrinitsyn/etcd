help.bridge_to: "La cible du pont : amqp://, amqps://, mqtt://, mqtts://, kafka:// ou kafkas://, puis [user:password@]host:port (Kafka : host:port,host:port) ; ou un point d'accès où envoyer chaque message par POST : http:// ou https://, de même, puis un chemin et une requête"
help.bridge_address: "L'adresse AMQP (file JMS), le préfixe de sujet MQTT ou le sujet Kafka. Vide : le nom de la file, ou celui du préfixe (/a/b/ donne a.b). Pas avec http(s)://"
