help.local_prefix: "Schlüsselpräfixe, die nie an Peers weitergegeben werden, durch Kommas getrennt: ein solcher Schlüssel lebt nur auf dem Knoten, der ihn schrieb. Leer: jeder Schlüssel wird weitergegeben"
help.local_prefix_except: "Unterpräfixe von local_prefix, die DOCH weitergegeben werden, durch Kommas getrennt; ein nicht genannter Zweig bleibt lokal"
help.local_only_prefix: "Schlüsselpräfixe, die nur einem lokalen (Loopback-)Aufrufer geliefert werden, durch Kommas getrennt; unabhängig von local_prefix"
help.local_only_prefix_except: "Zweige von local_only_prefix, die entfernten Aufrufern DOCH geliefert werden, durch Kommas getrennt; ein Peer leitet Schreibzugriffe darauf über die KV-API weiter. Leer: keine"
help.readonly_prefix: "Schlüsselpräfixe, die kein API-Aufrufer schreiben darf, durch Kommas getrennt: put, delete und txn werden abgelehnt, nur die einbettende Anwendung schreibt sie im Prozess. Leer: keine"
