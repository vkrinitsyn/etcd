# [i18n] etcds's messages in German - not reviewed: one file per language, every key in every
# file (src/i18n.rs tests it). Keys are `module.name`, as tr!("module.name") asks for
# them; an error's message starts with its code, ETCD-Ennn, the same in every language
_version: 1

# src/cli.rs - the command line's errors (ETCD-E001..E009)
cli.config_file: "ETCD-E001 Fehler in der Konfigurationsdatei [%{file}]:\n%{err}"

# src/cli.rs - the command line's help: help.<arg id>, the id the EtcdConfig field's
# name, and the command's own texts. Option names, values and URLs stay as they are
help.about: "etcds - ein leichter Server der etcd-v3-API für die Verwaltung von Warteschlangen\n(Übersetzung nicht geprüft: LANG=en für Englisch; Korrekturen: https://github.com/vkrinitsyn/etcd/issues)"
help.after_help: "Die Einstellungen sind diese Optionen und die Datei --config (YAML, die Schlüssel sind die Feldnamen: --listen-client-urls ist listen_client_urls); eine angegebene Option hat Vorrang vor der Datei. Die meisten Einstellungen von etcd werden nur aus Kompatibilitätsgründen akzeptiert: https://etcd.io/docs/v3.5/op-guide/configuration/"
help.usage: "Aufruf:"
