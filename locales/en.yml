# [i18n] etcds's messages in English: one file per language, every key in every
# file (src/i18n.rs tests it). Keys are `module.name`, as tr!("module.name") asks for
# them; an error's message starts with its code, ETCD-Ennn, the same in every language
_version: 1

# src/cli.rs - the command line's errors (ETCD-E001..E009)
cli.config_file: "ETCD-E001 Error in configuration file [%{file}]:\n%{err}"

# src/cli.rs - the command line's help: help.<arg id>, the id the EtcdConfig field's
# name, and the command's own texts. Option names, values and URLs stay as they are
help.about: "etcds - an etcd v3 API server, a light one for queue management"
help.after_help: "The settings are these flags and the --config file (YAML, keys are the field names: --listen-client-urls is listen_client_urls); a flag given wins over the file. Most of etcd's settings are accepted for compatibility only: https://etcd.io/docs/v3.5/op-guide/configuration/"
help.usage: "Usage:"
help.options: "Options"
help.arguments: "Arguments"
help.default: "[default: %{value}]"
help.help: "Print help"
help.input: "Input files (not used)"
help.config_path: "The configuration file, YAML; a missing one is no error"
help.node: "Node UUID"
help.cluster: "Cluster UUID"
help.term: "Logical term (epoch) of this node, incremented on restart or reconfiguration"
help.local_prefix: "Key prefixes that never propagate to peers, comma separated: such a key lives only on the node that wrote it. Empty: every key propagates"
help.local_prefix_except: "Sub-prefixes of local_prefix that DO propagate, comma separated; a branch not named stays local"
help.local_only_prefix: "Key prefixes served only to a loopback caller, comma separated; independent of local_prefix"
help.local_only_prefix_except: "Branches of local_only_prefix that ARE served to remote callers, comma separated; a peer forwards writes to them through the KV API. Empty: none"
help.readonly_prefix: "Key prefixes no API caller may write, comma separated: put, delete and txn are refused there, only the embedder writes them in-process. Empty: none"
help.zone_prefix: "Key prefixes that propagate only to peers in this node's zone, comma separated; composes with local_prefix. Empty: none"
help.zone: "This node's zone. Empty: unzoned, and unzoned nodes share one zone"
help.peer_zones: "Zone of each peer: host:port=zone, comma separated (the etcd member protocol carries no zone)"
help.name: "Human-readable name of this member"
help.data_dir: "Path to the data directory. Not used by etcds"
help.wal_dir: "Path to the dedicated WAL directory. Not used by etcds"
help.snapshot_count: "Number of committed transactions that triggers a snapshot to disk. Not used by etcds"
help.heartbeat_interval: "Heartbeat interval, in milliseconds. Not used by etcds"
help.election_timeout: "Election timeout, in milliseconds. Not used by etcds"
help.initial_election_tick_advance: "Fast-forward the initial election ticks on boot, for a faster election. Not used by etcds"
help.listen_peer_urls: "URLs to listen on for peer traffic, comma separated"
help.listen_client_urls: "URLs to listen on for client gRPC traffic, and HTTP unless --listen-client-http-urls is given, comma separated"
help.listen_client_http_urls: "URLs to listen on for HTTP-only client traffic; takes HTTP off --listen-client-urls"
help.clickhouse_url: "ClickHouse HTTP endpoint for /q/ch:<table>/ queues, e.g. http://127.0.0.1:8123 (may carry userinfo). Empty: no built-in consumer, and such a queue is like any other"
help.clickhouse_db: "Database for /q/ch:<table>/ queues whose name carries none"
help.queue_down_timeout: "Seconds a queue consumer's node may be unreachable before its consumers count as gone and what they were handed goes to the next consumer (at least once). Unset: 300; 0: never"
help.bridge_queue: "The etcd queue the bridge (feature bridge) sends to bridge_to, each message acknowledged once the broker took it. One of bridge_queue, bridge_prefix, bridge_listen; empty: no bridge"
help.bridge_prefix: "Instead of a queue, a key prefix (/config/) whose puts and deletes the bridge sends; nothing acknowledged, a change while the watch is down is missed"
help.bridge_listen: "The bridge as the AMQP peer on host:port: a JMS client's consumer of queue X is an etcd consumer of /q/X. No bridge_to then"
help.bridge_listen_user: "The user a client of bridge_listen logs in as (SASL PLAIN); empty: anonymous"
help.bridge_listen_password: "That user's password"
help.bridge_to: "The bridge's broker: amqp://, amqps://, mqtt://, mqtts://, kafka:// or kafkas://, then [user:password@]host:port (Kafka: host:port,host:port)"
help.bridge_address: "The AMQP address (JMS queue), MQTT topic prefix or Kafka topic. Empty: the queue's name, or the prefix's (/a/b/ is a.b)"
help.bridge_consumer: "The bridge's consumer UUID in the queue registry; keep it across restarts to keep one registration. Empty: a new one at each start"
help.bridge_body: "The JMS message type: auto (text when the value is UTF-8), text or bytes"
help.bridge_group_by_key: "AMQP: JMSXGroupID is the message key, each key pinned to one consumer"
help.bridge_cloudevents: "Add the CloudEvents attributes, in the target protocol's binding"
help.bridge_ce_type: "The CloudEvents type. Empty: etcd.queue.message"
help.bridge_dead_letter: "An etcd queue for messages no broker will take. Empty: they are retried"
help.bridge_buffer: "Deliveries held between etcd and the broker (0: 64)"
help.bridge_send_timeout: "Seconds to wait for the broker: to connect, and to take one message (0: 30)"
help.max_snapshots: "Maximum number of snapshot files to retain (0: unlimited)"
help.max_wals: "Maximum number of WAL files to retain (0: unlimited)"
