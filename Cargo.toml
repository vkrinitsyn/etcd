[package]
name = "etcds"
version = "0.17.0"
authors = ["Vladimir Krinitsyn <v.krinitsyn@gmail.com>"]
edition = "2024"
readme = "README.md"
license = "MIT OR Apache-2.0"
description = "An etcd v3 API server - light server version for queue management"
repository = "https://github.com/vkrinitsyn/etcd.git"
homepage = "https://github.com/vkrinitsyn/etcd"
keywords = ["etcd", "v3", "api", "server", "async"]

[dependencies]
slog = { version = "^2.0", features=["default"] }
sloggers = "^2.2"
tonic = "^0.14"
tonic-prost = "^0.14"
prost = "^0.14"
tokio = { version = "^1.44", features = ["full"] }
tokio-stream = "^0.1"
dns-lookup = "^3.0"


clap = "^4.5"
clap-serde-derive = "0.2.1"

rust-i18n = "4"
serde = { version = "^1.0", features = ["derive"] }
serde_yaml = "^0.9"

shims = {version = "^0.1"}
uuid = { version = "1", features = ["v4"] }
opentelemetry_sdk = { version = "^0.32", features = ["rt-tokio", "trace"], optional = true }
opentelemetry = { version = "^0.32", optional = true }

# built-in ClickHouse queue consumer (feature "clickhouse"). tonic already pulls
# hyper in, so these add no new crates to the graph.
hyper = { version = "^1", features = ["client", "http1"], optional = true }
hyper-util = { version = "^0.1", features = ["tokio"], optional = true }
http-body-util = { version = "^0.1", optional = true }
bytes = { version = "^1", optional = true }

[features]
default = []
tracer = ["dep:opentelemetry", "dep:opentelemetry_sdk"]
# /q/ch:<table>/ and /queue/clickhouse:<table>/ queues write straight to ClickHouse
clickhouse = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes"]

[dev-dependencies]
tokio = { version = "^1.44", features = ["full"] }
etcd-client = {version = "^0.19", features = []}
slog = { version = "^2.8", features=["default"] }

[build-dependencies]
tonic-prost-build = "^0.14"

[package.metadata.docs.rs]
features = ["tls", "tls-roots"]
rustdoc-args = ["--cfg", "docsrs"]
