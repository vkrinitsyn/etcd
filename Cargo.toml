[package]
name = "etcds"
version = "0.22.2"
authors = ["Vladimir Krinitsyn <v.krinitsyn@gmail.com>", "support@dbinvent.com"]
edition = "2024"
readme = "README.md"
license = "MIT OR Apache-2.0"
description = "An etcd v3 API server - light server version for queue management"
repository = "https://github.com/vkrinitsyn/etcd.git"
homepage = "https://vkrinitsyn.github.io/"
keywords = ["etcd", "v3", "api", "server", "queue"]

[dependencies]
slog = { version = "^2.0", features=["default"] }
sloggers = "^2.2"
tonic = "^0.14"
tonic-prost = "^0.14"
prost = "^0.14"
tokio = { version = "^1.54.1", features = ["full"] }
tokio-stream = "^0.1"
dns-lookup = "^4.0"


# "string": the headings of the translated --help are Strings (cli.rs)
clap = { version = "^4.5", features = ["derive", "string"] }

# the messages, in locales/*.yml: compiled in, each in every language - see src/i18n.rs
rust-i18n = "^4.2.4"
serde = { version = "^1.0", features = ["derive"] }
# the config file (cli.rs). Not serde_yaml: deprecated, and its unsafe-libyaml is
# unmaintained (RUSTSEC-2024-0449). serde-saphyr has no unsafe code, and ^1.3 is
# the one rust-i18n already builds; it has no YAML value, so the merge is JSON's
serde-saphyr = "^2.0"
serde_json = "^1"

shims = {version = "^0.1"}
uuid = { version = "1", features = ["v4"] }
opentelemetry_sdk = { version = "^0.33", features = ["rt-tokio", "trace"], optional = true }
opentelemetry = { version = "^0.33", optional = true }

# built-in ClickHouse queue consumer (feature "clickhouse"). tonic already pulls
# hyper in, so these add no new crates to the graph.
hyper = { version = "^1", features = ["client", "http1"], optional = true }
hyper-util = { version = "^0.1", features = ["tokio"], optional = true }
http-body-util = { version = "^0.1", optional = true }
bytes = { version = "^1", optional = true }
# the bridge from a queue or key prefix to a broker: JMS over AMQP 1.0, MQTT 5,
# Kafka (feature "bridge", the bridge_* settings)
etcd-client = { version = "^0.21", optional = true }
fe2o3-amqp = { version = "^0.18.4", features = ["acceptor", "rustls"], optional = true }
futures-util = { version = "^0.3", optional = true }
rskafka = { version = "^0.6.0", default-features = false, features = ["transport-tls"], optional = true }
# native-tls: rumqttc's rustls feature brings rustls-webpki 0.102 (RUSTSEC-2026-0049 and others)
rumqttc = { version = "^0.25.1", default-features = false, features = ["use-native-tls"], optional = true }
rustls = { version = "^0.23", optional = true }
rustls-pki-types = { version = "^1", features = ["std"], optional = true }
webpki-roots = { version = "^1", optional = true }

[features]
default = []
tracer = ["dep:opentelemetry", "dep:opentelemetry_sdk"]
# /q/ch:<table>/ and /queue/clickhouse:<table>/ queues write straight to ClickHouse
clickhouse = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes"]
# bridge_queue, bridge_prefix or bridge_listen to a broker, started by the binary
bridge = ["dep:etcd-client", "dep:fe2o3-amqp", "dep:futures-util", "dep:rskafka", "dep:rumqttc", "dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots"]

[dev-dependencies]
tokio = { version = "^1.44", features = ["full"] }
etcd-client = {version = "^0.21", features = []}
slog = { version = "^2.8", features=["default"] }

[build-dependencies]
tonic-prost-build = "^0.14"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
